global: {scrape_interval: 5s}
scrape_configs:
  - job_name: redpanda
    static_configs: [{targets: ['redpanda:9644']}]
    metrics_path: /public_metrics
  - job_name: ingest
    static_configs: [{targets: ['host.docker.internal:2112']}]
  - job_name: api
    static_configs: [{targets: ['host.docker.internal:8000']}]
