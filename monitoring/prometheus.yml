global: {scrape_interval: 5s}
scrape_configs:
  - job_name: redpanda
    static_configs: [{targets: ['redpanda:9644']}]
    metrics_path: /public_metrics
  - job_name: ingest
    static_configs:
      - targets:
          - 'ingest-normalize:2112'
          - 'host.docker.internal:2112'
          - 'ingest-sink:2114'
          - 'host.docker.internal:2114'
          - 'ingest-alerts:2115'
          - 'host.docker.internal:2115'
  - job_name: simulator
    static_configs: [{targets: ['simulator:2113', 'host.docker.internal:2113']}]
  - job_name: api
    static_configs: [{targets: ['api:8000', 'host.docker.internal:8000']}]
  - job_name: agent
    static_configs: [{targets: ['agent:8001', 'host.docker.internal:8001']}]
