name: evc
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --smp, "2", --memory, 1536M, --reserve-memory, 0M, --overprovisioned, --node-id, "0", --check=false,
      --kafka-addr, "internal://0.0.0.0:9092,external://0.0.0.0:19092", --advertise-kafka-addr, "internal://redpanda:9092,external://localhost:19092"]
    ports: ["19092:19092"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck: {test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"], interval: 10s, retries: 12}
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on: {redpanda: {condition: service_healthy}}
    entrypoint: ["/bin/sh","-c","rpk -X brokers=redpanda:9092 topic create telemetry.raw -p 12 -r 1 || true; rpk -X brokers=redpanda:9092 topic create telemetry.canonical -p 12 -r 1 || true; rpk -X brokers=redpanda:9092 topic create alerts -p 6 -r 1 || true; rpk -X brokers=redpanda:9092 topic create telemetry.dlq -p 3 -r 1 || true"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123","9000:9000"]
    volumes: [clickhouse:/var/lib/clickhouse, ./db/clickhouse:/docker-entrypoint-initdb.d]
    environment: {CLICKHOUSE_DB: evc, CLICKHOUSE_USER: evc, CLICKHOUSE_PASSWORD: "${CH_PASSWORD}", CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"}
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    mem_limit: 3g
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment: {POSTGRES_DB: evc, POSTGRES_USER: evc, POSTGRES_PASSWORD: "${PG_PASSWORD}"}
    volumes: [pg:/var/lib/postgresql/data, ./db/postgres:/docker-entrypoint-initdb.d]
    mem_limit: 1g
  redis:
    image: redis:7-alpine
    command: ["redis-server","--maxmemory","512mb","--maxmemory-policy","allkeys-lru","--appendonly","no"]
    ports: ["6379:6379"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"}
volumes: {redpanda: {}, clickhouse: {}, pg: {}}
