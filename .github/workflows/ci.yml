name: CI Pipeline

on:
  push:
    branches: [ main, master, "phase-*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint Python (Ruff)
        run: |
          pip install ruff
          ruff check . || true
      - name: Lint Go
        run: |
          if [ -d "services/simulator" ]; then
            cd services/simulator && go vet ./... || true
          fi
          if [ -d "services/ingest" ]; then
            cd services/ingest && go vet ./... || true
          fi

  unit-and-bdd-tests:
    name: Unit & BDD Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Go Unit Tests
        run: |
          if [ -d "services/simulator" ]; then
            cd services/simulator && go test -v ./... || true
          fi
          if [ -d "services/ingest" ]; then
            cd services/ingest && go test -v ./... || true
          fi
      - name: Run Python Unit Tests
        run: |
          pip install -r services/agent/requirements.txt || true
          pip install pytest pytest-cov behave
          python -m pytest services/api/ -v || true
          python -m pytest services/agent/tests/ -v
      - name: Run BDD Acceptance Tests
        run: |
          behave tests/bdd/features/fleet_acceptance.feature

  infra-validate:
    name: Infrastructure Validation (Helm & Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 'latest'
      - name: Validate Helm Chart
        run: |
          helm lint infra/helm/evc
          helm template evc infra/helm/evc > /dev/null
      - name: Validate Terraform AWS
        run: |
          cd infra/terraform/aws
          terraform init -backend=false
          terraform fmt -check || true
          terraform validate

  security-scans:
    name: Security Scans (SAST, Secrets, Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - name: Run Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true
      - name: Run Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit || true

  build-containers:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [lint, unit-and-bdd-tests, infra-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Build Agent Container
        run: |
          docker build -t evc-agent:latest -f services/agent/Dockerfile .
