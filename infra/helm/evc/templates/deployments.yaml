apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingest-normalize
  labels:
    app.kubernetes.io/name: evc-ingest-normalize
spec:
  replicas: {{ .Values.ingest.normalize.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: evc-ingest-normalize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evc-ingest-normalize
    spec:
      containers:
        - name: normalize
          image: "{{ .Values.ingest.normalize.image.repository }}:{{ .Values.ingest.normalize.image.tag }}"
          command: ["--mode=normalize", "--metrics-port={{ .Values.ingest.normalize.metricsPort }}"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
---
