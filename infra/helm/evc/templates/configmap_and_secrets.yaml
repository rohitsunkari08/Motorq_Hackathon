apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: evc
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  KAFKA_BROKERS: {{ .Values.externalDataStores.redpandaBrokers | quote }}
  CLICKHOUSE_ADDR: {{ .Values.externalDataStores.clickhouseAddr | quote }}
  REDIS_ADDR: {{ .Values.externalDataStores.redisAddr | quote }}
  POSTGRES_HOST: {{ .Values.externalDataStores.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.externalDataStores.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.externalDataStores.postgresDb | quote }}
  API_URL: "http://{{ .Release.Name }}-api:8000/api/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: evc
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  PG_PASSWORD: {{ .Values.secrets.pgPassword | quote }}
  CH_PASSWORD: {{ .Values.secrets.chPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
